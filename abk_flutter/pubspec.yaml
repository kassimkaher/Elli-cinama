name: abk_player
description: "ABK streaming client — clean Flutter foundation (Phase 1: backend + data layer)."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management / DI
  flutter_riverpod: ^2.6.1

  # Networking (content middleware + streaming host + Firebase RC REST)
  http: ^1.2.0

  # Storage
  flutter_secure_storage: ^9.2.2   # secrets (credentials, session)
  shared_preferences: ^2.3.0       # non-sensitive prefs + local features

  # Device envelope
  device_info_plus: ^11.0.0

  # Playback abstraction (ExoPlayer/AVPlayer backed)
  video_player: ^2.9.0
  fvp: ^0.38.1
  path_provider: ^2.1.6
dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

# App launcher/brand icon — generated from the unified ABK mark.
# Regenerate: dart run flutter_launcher_icons
flutter_launcher_icons:
  image_path: "assets/brand/abk_icon.png"
  android: true
  min_sdk_android: 21
  adaptive_icon_background: "#0E0D0C"
  adaptive_icon_foreground: "assets/brand/abk_icon_foreground.png"
  ios: true
  remove_alpha_ios: true
  macos:
    generate: true
    image_path: "assets/brand/abk_icon.png"
